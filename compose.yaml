services:
  minio:
    image: cr.umapps.net/umapps/minio4dev:${IMAGE_TAG:-beta}
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEV_BUCKETS: ${MINIO_DEV_BUCKETS:-default}
    volumes:
      - ./data:/data
    expose:
      - "9000"
      - "9001"
    ports:
      - "9000:9000"
      - "9001:9001"
